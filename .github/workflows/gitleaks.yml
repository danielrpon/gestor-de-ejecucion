name: Revisar secretos
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1
        run: |
          curl -sSfL -o g.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  g.tar.gz" | sha256sum -c -
          tar xzf g.tar.gz gitleaks
      - name: Revisar todo el historial
        run: ./gitleaks git --redact=100 --no-banner --verbose .
